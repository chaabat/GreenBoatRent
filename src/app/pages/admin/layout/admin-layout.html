<div class="flex min-h-screen flex-col bg-[#F3F1EC] lg:flex-row">

  <!-- ===== SIDEBAR (top bar on mobile) ===== -->
  <aside class="shrink-0 bg-navy text-white lg:sticky lg:top-0 lg:flex lg:h-screen lg:w-64 lg:flex-col lg:px-5 lg:py-8">
    <div class="flex items-center justify-between gap-4 px-5 py-4 lg:block lg:p-0">
      <img src="images/logo-white.png" alt="Green Boat Rent" class="h-10 w-auto lg:h-14">
      <button type="button" (click)="logout()"
              class="rounded-full border border-white/30 px-4 py-2 text-xs font-semibold transition hover:border-gold hover:text-gold lg:hidden">
        Esci
      </button>
    </div>

    <nav class="flex gap-1 overflow-x-auto px-3 pb-3 lg:mt-10 lg:flex-col lg:overflow-visible lg:p-0">
      @for (l of links; track l.path) {
        <a [routerLink]="l.path" routerLinkActive="!bg-white/10 !text-white font-semibold"
           [routerLinkActiveOptions]="{ exact: l.exact }"
           class="flex shrink-0 items-center gap-3 rounded-xl px-4 py-3 text-sm text-white/70 transition hover:bg-white/5 hover:text-white">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path [attr.d]="l.icon"/></svg>
          {{ l.label }}
        </a>
      }
      <a routerLink="/" class="flex shrink-0 items-center gap-3 rounded-xl px-4 py-3 text-sm text-white/50 transition hover:text-white">Vai al sito ↗</a>
    </nav>

    <div class="mt-auto hidden lg:block">
      <p class="truncate text-xs text-white/60">{{ auth.user()?.email }}</p>
      <button type="button" (click)="logout()"
              class="mt-3 rounded-full border border-white/30 px-4 py-2 text-xs font-semibold transition hover:border-gold hover:text-gold">
        Esci
      </button>
    </div>
  </aside>

  <!-- ===== PAGE ===== -->
  <div class="min-w-0 flex-1">
    <router-outlet />
  </div>
</div>
