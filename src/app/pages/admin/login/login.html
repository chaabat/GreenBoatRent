<section class="relative flex min-h-screen items-center justify-center overflow-hidden bg-navy px-5 py-16">
  <img src="images/spots/arcipelago.jpg" alt="" class="absolute inset-0 h-full w-full object-cover opacity-30">
  <div class="absolute inset-0 bg-gradient-to-b from-navy/60 to-navy"></div>

  <div class="relative w-full max-w-md">
    <div class="mb-8 text-center">
      <img src="images/logo-white.png" alt="Green Boat Rent" class="mx-auto h-16 w-auto">
      <p class="mt-3 text-xs font-semibold uppercase tracking-[0.25em] text-gold">Area riservata</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate
          class="space-y-5 rounded-3xl bg-white p-7 shadow-2xl sm:p-8">
      <h1 class="font-serif text-3xl text-navy">Accedi</h1>

      <label class="block">
        <span class="mb-1 block text-sm font-semibold text-navy">Email</span>
        <input formControlName="email" type="email" autocomplete="username"
               class="w-full rounded-xl border border-mist bg-sand/50 px-4 py-3 text-navy outline-none transition focus:border-ocean focus:bg-white">
      </label>

      <label class="block">
        <span class="mb-1 block text-sm font-semibold text-navy">Password</span>
        <span class="relative block">
          <input formControlName="password" [type]="showPw() ? 'text' : 'password'" autocomplete="current-password"
                 class="w-full rounded-xl border border-mist bg-sand/50 px-4 py-3 pr-12 text-navy outline-none transition focus:border-ocean focus:bg-white">
          <button type="button" (click)="showPw.set(!showPw())"
                  [attr.aria-label]="showPw() ? 'Nascondi password' : 'Mostra password'"
                  class="absolute inset-y-0 right-0 flex w-12 items-center justify-center text-navy/50 hover:text-navy">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
              @if (showPw()) { <path d="M3 3l18 18"/> }
            </svg>
          </button>
        </span>
      </label>

      @if (error()) {
        <p class="rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700" role="alert">{{ error() }}</p>
      }

      <button type="submit" [disabled]="loading()"
              class="flex w-full items-center justify-center gap-2 rounded-full bg-navy py-3.5 font-semibold text-white transition hover:bg-ocean disabled:opacity-60">
        @if (loading()) {
          <svg class="h-5 w-5 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" stroke-opacity=".25"/><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3"/></svg>
        }
        Accedi
      </button>
    </form>

    <a routerLink="/" class="mt-6 block text-center text-sm text-white/60 hover:text-white">← Torna al sito</a>
  </div>
</section>
