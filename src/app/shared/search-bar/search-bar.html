<form (submit)="$event.preventDefault(); book()"
      class="grid gap-2 rounded-3xl bg-white p-3 shadow-2xl shadow-navy/20 md:grid-cols-[1.4fr_1fr_auto] md:gap-0 md:rounded-full md:p-2">

  <!-- Boat -->
  <label class="flex items-center gap-3 rounded-2xl px-4 py-2 transition md:rounded-full md:px-6"
         [class.ring-2]="missingBoat()" [class.ring-red-400]="missingBoat()" [class.animate-shake]="missingBoat()">
    @if (selected(); as b) {
      <img [src]="b.cutout" alt="" class="h-10 w-16 shrink-0 object-contain">
    } @else {
      <svg class="shrink-0 text-navy" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 15l2-5h11l5 5"/><path d="M8 10V7h5l2 3"/><path d="M2 19c2 1.3 4 1.3 6 0s4-1.3 6 0 4 1.3 6 0"/></svg>
    }
    <span class="flex w-full min-w-0 flex-col">
      <span class="text-sm font-semibold text-navy">Scegli la barca</span>
      <select [value]="boatId()" (change)="pickBoat($any($event.target).value)"
              class="w-full cursor-pointer truncate bg-transparent text-sm text-navy/70 outline-none">
        <option value="" disabled>Seleziona un'imbarcazione</option>
        @for (b of boats(); track b.id) {
          <option [value]="b.id">{{ b.name }} · fino a {{ b.pax }} persone · {{ b.licenseLabel }}</option>
        }
      </select>
      @if (missingBoat()) {
        <span class="text-xs font-semibold text-red-500">Seleziona prima una barca</span>
      }
    </span>
  </label>

  <!-- Date -->
  <label class="flex items-center gap-3 rounded-2xl px-4 py-2 md:rounded-none md:border-l md:border-mist md:px-6">
    <svg class="shrink-0 text-navy" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span class="flex w-full flex-col">
      <span class="text-sm font-semibold text-navy">Data <span class="font-normal text-navy/50">(facoltativa)</span></span>
      <input type="date" [min]="today" [value]="date()" (change)="date.set($any($event.target).value)"
             class="w-full bg-transparent text-sm text-navy/70 outline-none">
    </span>
  </label>

  <!-- Button -->
  <button type="submit"
          class="flex items-center justify-center gap-2 rounded-2xl bg-navy px-8 py-4 text-sm font-semibold text-white transition hover:bg-ocean md:rounded-full">
    Prenota
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
</form>
