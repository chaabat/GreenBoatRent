<form (submit)="$event.preventDefault(); search()"
      class="grid gap-2 rounded-3xl bg-white p-3 shadow-2xl shadow-navy/20 md:grid-cols-[1fr_1fr_1fr_auto] md:gap-0 md:rounded-full md:p-2">

  <!-- Date -->
  <label class="flex items-center gap-3 rounded-2xl px-4 py-2 md:rounded-full md:px-6">
    <svg class="shrink-0 text-navy" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span class="flex w-full flex-col">
      <span class="text-sm font-semibold text-navy">Data</span>
      <input type="date" [min]="today" [value]="date()" (change)="date.set($any($event.target).value)"
             class="w-full bg-transparent text-sm text-navy/70 outline-none">
    </span>
  </label>

  <!-- Boat -->
  <label class="flex items-center gap-3 rounded-2xl px-4 py-2 md:rounded-none md:border-l md:border-mist md:px-6">
    <svg class="shrink-0 text-navy" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 15l2-5h11l5 5"/><path d="M8 10V7h5l2 3"/><path d="M2 19c2 1.3 4 1.3 6 0s4-1.3 6 0 4 1.3 6 0"/></svg>
    <span class="flex w-full flex-col">
      <span class="text-sm font-semibold text-navy">Imbarcazione</span>
      <select [value]="boat()" (change)="boat.set($any($event.target).value)"
              class="w-full cursor-pointer bg-transparent text-sm text-navy/70 outline-none">
        <option value="">Tutte le imbarcazioni</option>
        @for (b of boats(); track b.id) {
          <option [value]="b.id">{{ b.name }}</option>
        }
      </select>
    </span>
  </label>

  <!-- Pax -->
  <label class="flex items-center gap-3 rounded-2xl px-4 py-2 md:rounded-none md:border-l md:border-mist md:px-6">
    <svg class="shrink-0 text-navy" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.3 0 4 1.5 4.5 4"/></svg>
    <span class="flex w-full flex-col">
      <span class="text-sm font-semibold text-navy">Passeggeri</span>
      <select [value]="pax()" (change)="pax.set($any($event.target).value)"
              class="w-full cursor-pointer bg-transparent text-sm text-navy/70 outline-none">
        <option value="">Seleziona</option>
        @for (p of paxOptions; track p) {
          <option [value]="p">{{ p }} {{ p === 1 ? 'persona' : 'persone' }}</option>
        }
      </select>
    </span>
  </label>

  <!-- Button -->
  <button type="submit"
          class="flex items-center justify-center gap-2 rounded-2xl bg-navy px-7 py-4 text-sm font-semibold text-white transition hover:bg-ocean md:rounded-full">
    Verifica disponibilità
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
</form>
