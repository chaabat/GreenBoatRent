<a class="card" [class.active]="active()" [routerLink]="['/flotta', boat().id]"
   [attr.aria-label]="'Scopri ' + boat().name"
   (pointermove)="tilt($event)" (pointerleave)="resetTilt($event)">

  <!-- Scene: boat photo → Sardinia spot -->
  <div class="wrapper">
    <img class="cover" [src]="boat().cover" alt="" (error)="hide($event)">
    <img class="spot" [src]="boat().spot.image" alt="" loading="lazy" (error)="hide($event)">
  </div>

  <!-- Boat that sails out toward you -->
  <div class="boat-wrap" aria-hidden="true">
    <span class="wake"></span>
    <span class="wake w2"></span>
    <img class="boat" [src]="boat().cutout" alt="" (error)="hide($event)">
  </div>

  <!-- Info -->
  <div class="info">
    <div class="tags">
      <span class="badge">{{ boat().licenseLabel }}</span>
      <span class="place">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
        {{ boat().spot.name }}
      </span>
    </div>

    <h3 class="name">{{ boat().name }}</h3>

    <ul class="specs">
      <li>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/></svg>
        {{ boat().pax }} pax
      </li>
      <li>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg>
        {{ boat().length }}
      </li>
      <li>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>
        {{ boat().engine }}
      </li>
    </ul>

    <span class="cta">
      Prenota ora
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </span>
  </div>
</a>
